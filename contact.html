<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Lauren Cordy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="lane-strip"><span></span><span></span><span></span></div>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="nav__logo">Lauren Cordy</a>
    <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">Menu</button>
    <ul class="nav__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="case-studies.html">Case Studies</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="hero" style="padding-bottom:0; border-bottom:none;">
    <div class="container">
      <span class="eyebrow">Get in touch</span>
      <h1>Let's talk</h1>
      <p class="hero__lede">
        Open to junior Business Analyst and BA associate roles. The fastest way to reach me is by completing
        the below form.
      </p>
    </div>
  </section>

  <section style="border-bottom:none;">
    <div class="container">
      <form class="contact-form" id="contact-form" style="max-width:520px;">
        <div>
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div>
          <label for="email">Your email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" class="btn">Send message</button>
      </form>

      <p style="max-width:520px; margin-top:24px;">
        <a href="assets/cv.pdf" class="btn btn--ghost">Download CV</a>
      </p>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">© <span id="year"></span> Lauren Cordy.</div>
</footer>

<script src="script.js"></script>
</body>
</html>
