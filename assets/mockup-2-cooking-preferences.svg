<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="375" height="812" fill="#ffffff"/>
  <rect x="4" y="4" width="367" height="804" rx="42" fill="#ffffff" stroke="#111111" stroke-width="3"/>

  <!-- status notch -->
  <rect x="137" y="18" width="100" height="22" rx="11" fill="#111111"/>

  <!-- back chevron -->
  <path d="M44 62 L34 72 L44 82" fill="none" stroke="#333333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- title -->
  <text x="32" y="112" font-size="26" font-weight="700" fill="#111111">Cook Your Way</text>

  <!-- subtitle -->
  <text x="32" y="140" font-size="14" fill="#555555">Choose how you'd like your recipe</text>
  <text x="32" y="160" font-size="14" fill="#555555">instructions to be displayed.</text>

  <!-- card: Standard -->
  <rect x="32" y="188" width="311" height="64" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <circle cx="60" cy="220" r="10" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="225" font-size="16" fill="#222222">Standard</text>

  <!-- card: Prep First (selected) -->
  <rect x="32" y="264" width="311" height="64" rx="12" fill="#f5f5f5" stroke="#111111" stroke-width="2.5"/>
  <circle cx="60" cy="296" r="10" fill="none" stroke="#111111" stroke-width="1.5"/>
  <circle cx="60" cy="296" r="5" fill="#111111"/>
  <text x="86" y="301" font-size="16" font-weight="700" fill="#111111">Prep First</text>

  <!-- card: Guided Step-by-Step -->
  <rect x="32" y="340" width="311" height="64" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <circle cx="60" cy="372" r="10" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="377" font-size="16" fill="#222222">Guided Step-by-Step</text>

  <!-- card: Quick Mode -->
  <rect x="32" y="416" width="311" height="64" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
  <circle cx="60" cy="448" r="10" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="453" font-size="16" fill="#222222">Quick Mode</text>

  <!-- continue button -->
  <rect x="32" y="700" width="311" height="56" rx="12" fill="#111111"/>
  <text x="187" y="734" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Continue</text>

  <!-- home indicator -->
  <rect x="137" y="782" width="100" height="5" rx="2.5" fill="#cccccc"/>
</svg>
