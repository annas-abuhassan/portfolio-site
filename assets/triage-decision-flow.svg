<svg viewBox="0 0 730 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="730" height="640" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4A5157"/>
    </marker>
  </defs>

  <!-- Step 1: select species -->
  <rect x="270" y="16" width="190" height="56" rx="10" fill="#EDEFF2" stroke="#14181C" stroke-width="2"/>
  <text x="365" y="40" font-size="14" font-weight="700" fill="#14181C" text-anchor="middle">1 · Select species</text>
  <text x="365" y="58" font-size="11" fill="#4A5157" text-anchor="middle">Pigeon · Hedgehog · Gull · Fox · Other</text>

  <line x1="365" y1="72" x2="365" y2="102" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: guided questions -->
  <rect x="175" y="104" width="380" height="172" rx="10" fill="#ffffff" stroke="#D8DCE0" stroke-width="1.5"/>
  <text x="365" y="128" font-size="14" font-weight="700" fill="#14181C" text-anchor="middle">2 · Guided yes/no questions</text>

  <circle cx="200" cy="150" r="3.5" fill="#2B5FA8"/>
  <text x="212" y="155" font-size="12.5" fill="#222222">Is the bird bleeding?</text>
  <circle cx="200" cy="175" r="3.5" fill="#2B5FA8"/>
  <text x="212" y="180" font-size="12.5" fill="#222222">Can it stand?</text>
  <circle cx="200" cy="200" r="3.5" fill="#2B5FA8"/>
  <text x="212" y="205" font-size="12.5" fill="#222222">Is a wing hanging?</text>
  <circle cx="200" cy="225" r="3.5" fill="#2B5FA8"/>
  <text x="212" y="230" font-size="12.5" fill="#222222">Is it bright and alert?</text>
  <circle cx="200" cy="250" r="3.5" fill="#2B5FA8"/>
  <text x="212" y="255" font-size="12.5" fill="#222222">Has it been caught by a cat?</text>

  <line x1="365" y1="276" x2="365" y2="306" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: decision diamond -->
  <polygon points="365,306 460,376 365,446 270,376" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="365" y="372" font-size="13.5" font-weight="700" fill="#14181C" text-anchor="middle">3 · Decision logic</text>
  <text x="365" y="390" font-size="11" fill="#4A5157" text-anchor="middle">based on answers</text>

  <!-- fan-out arrows to 4 outcomes -->
  <line x1="330" y1="410" x2="90" y2="490" stroke="#4A5157" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="428" x2="270" y2="490" stroke="#4A5157" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="428" x2="450" y2="490" stroke="#4A5157" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="410" x2="630" y2="490" stroke="#4A5157" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- outcome 1: monitor and release -->
  <rect x="10" y="492" width="160" height="76" rx="10" fill="#E7F2ED" stroke="#3C8B6C" stroke-width="2"/>
  <text x="90" y="524" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Monitor and</text>
  <text x="90" y="540" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">release</text>
  <text x="90" y="558" font-size="10.5" fill="#3C8B6C" text-anchor="middle" letter-spacing="0.5">SAFE</text>

  <!-- outcome 2: wildlife rescue -->
  <rect x="190" y="492" width="160" height="76" rx="10" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="270" y="518" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">Take to Wildlife</text>
  <text x="270" y="534" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">Rescue for</text>
  <text x="270" y="550" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">observation</text>
  <text x="270" y="562" font-size="10" fill="#2B5FA8" text-anchor="middle" letter-spacing="0.5">ADVISORY</text>

  <!-- outcome 3: contact lead rescuer -->
  <rect x="370" y="492" width="160" height="76" rx="10" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="450" y="524" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Contact Lead</text>
  <text x="450" y="540" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Rescuer</text>
  <text x="450" y="558" font-size="10.5" fill="#2B5FA8" text-anchor="middle" letter-spacing="0.5">ESCALATE</text>

  <!-- outcome 4: emergency vet -->
  <rect x="550" y="492" width="160" height="76" rx="10" fill="#EDEFF2" stroke="#14181C" stroke-width="2.5"/>
  <text x="630" y="532" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Emergency</text>
  <text x="630" y="548" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Vet</text>
  <text x="630" y="562" font-size="10.5" fill="#14181C" text-anchor="middle" letter-spacing="0.5">URGENT</text>

  <!-- legend -->
  <text x="10" y="606" font-size="11" fill="#4A5157">Same yes/no question set produces one of four outcome tiers, ranked by urgency.</text>
</svg>
