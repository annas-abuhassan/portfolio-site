<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4A5157"/>
    </marker>
  </defs>

  <!-- Step 1: select species -->
  <rect x="290" y="24" width="220" height="64" rx="10" fill="#EDEFF2" stroke="#14181C" stroke-width="2"/>
  <text x="400" y="52" font-size="15" font-weight="700" fill="#14181C" text-anchor="middle">Select species</text>
  <text x="400" y="72" font-size="11" fill="#4A5157" text-anchor="middle">Pigeon · Hedgehog · Gull · Fox · Other</text>

  <line x1="400" y1="88" x2="400" y2="116" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: guided questions -->
  <rect x="160" y="120" width="480" height="190" rx="10" fill="#ffffff" stroke="#D8DCE0" stroke-width="1.5"/>
  <text x="400" y="148" font-size="15" font-weight="700" fill="#14181C" text-anchor="middle">Guided yes/no questions</text>

  <circle cx="196" cy="172" r="3.5" fill="#2B5FA8"/>
  <text x="210" y="177" font-size="13" fill="#222222">Is the bird bleeding?</text>
  <circle cx="196" cy="199" r="3.5" fill="#2B5FA8"/>
  <text x="210" y="204" font-size="13" fill="#222222">Can it stand?</text>
  <circle cx="196" cy="226" r="3.5" fill="#2B5FA8"/>
  <text x="210" y="231" font-size="13" fill="#222222">Is a wing hanging?</text>
  <circle cx="196" cy="253" r="3.5" fill="#2B5FA8"/>
  <text x="210" y="258" font-size="13" fill="#222222">Is it bright and alert?</text>
  <circle cx="196" cy="280" r="3.5" fill="#2B5FA8"/>
  <text x="210" y="285" font-size="13" fill="#222222">Has it been caught by a cat?</text>

  <line x1="400" y1="310" x2="400" y2="338" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: decision point -->
  <rect x="280" y="342" width="240" height="68" rx="12" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="400" y="372" font-size="15" font-weight="700" fill="#14181C" text-anchor="middle">Decision logic</text>
  <text x="400" y="392" font-size="11" fill="#2B5FA8" text-anchor="middle">based on the answers above</text>

  <!-- stem down to distribution line -->
  <line x1="400" y1="410" x2="400" y2="440" stroke="#4A5157" stroke-width="2"/>
  <!-- horizontal distribution line -->
  <line x1="115" y1="440" x2="685" y2="440" stroke="#4A5157" stroke-width="2"/>
  <!-- drops into each outcome -->
  <line x1="115" y1="440" x2="115" y2="468" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="305" y1="440" x2="305" y2="468" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="495" y1="440" x2="495" y2="468" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="685" y1="440" x2="685" y2="468" stroke="#4A5157" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="432" font-size="10.5" fill="#8A9199" text-anchor="start" letter-spacing="0.5">FOUR POSSIBLE OUTCOMES</text>

  <!-- outcome 1: monitor and release -->
  <rect x="30" y="470" width="170" height="92" rx="10" fill="#E7F2ED" stroke="#3C8B6C" stroke-width="2"/>
  <text x="115" y="505" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Monitor and</text>
  <text x="115" y="523" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">release</text>
  <rect x="91" y="536" width="48" height="18" rx="9" fill="#ffffff" stroke="#3C8B6C" stroke-width="1.2"/>
  <text x="115" y="548.5" font-size="9.5" font-weight="700" fill="#3C8B6C" text-anchor="middle" letter-spacing="0.5">SAFE</text>

  <!-- outcome 2: wildlife rescue -->
  <rect x="220" y="470" width="170" height="92" rx="10" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="305" y="497" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">Take to Wildlife</text>
  <text x="305" y="513" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">Rescue for</text>
  <text x="305" y="529" font-size="12" font-weight="700" fill="#14181C" text-anchor="middle">observation</text>
  <rect x="269" y="536" width="72" height="18" rx="9" fill="#ffffff" stroke="#2B5FA8" stroke-width="1.2"/>
  <text x="305" y="548.5" font-size="9.5" font-weight="700" fill="#2B5FA8" text-anchor="middle" letter-spacing="0.5">ADVISORY</text>

  <!-- outcome 3: contact lead rescuer -->
  <rect x="410" y="470" width="170" height="92" rx="10" fill="#E7EEF7" stroke="#2B5FA8" stroke-width="2"/>
  <text x="495" y="505" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Contact Lead</text>
  <text x="495" y="523" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Rescuer</text>
  <rect x="459" y="536" width="72" height="18" rx="9" fill="#ffffff" stroke="#2B5FA8" stroke-width="1.2"/>
  <text x="495" y="548.5" font-size="9.5" font-weight="700" fill="#2B5FA8" text-anchor="middle" letter-spacing="0.5">ESCALATE</text>

  <!-- outcome 4: emergency vet -->
  <rect x="600" y="470" width="170" height="92" rx="10" fill="#EDEFF2" stroke="#14181C" stroke-width="2.5"/>
  <text x="685" y="514" font-size="13" font-weight="700" fill="#14181C" text-anchor="middle">Emergency Vet</text>
  <rect x="656" y="536" width="58" height="18" rx="9" fill="#ffffff" stroke="#14181C" stroke-width="1.2"/>
  <text x="685" y="548.5" font-size="9.5" font-weight="700" fill="#14181C" text-anchor="middle" letter-spacing="0.5">URGENT</text>

  <!-- caption -->
  <text x="30" y="592" font-size="11.5" fill="#4A5157">Same yes/no question set produces one of four outcome tiers, ranked by urgency.</text>
</svg>
